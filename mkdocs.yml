site_name: Blog & Laboratorios de Ciberseguridad
site_description: Portfolio colaborativo de este equipazo.
site_author: Peluc4s
site_url: https://peluc4s.github.io/Mimir-Vault/
markdown_extensions:
  - tables
  - attr_list
  - md_in_html

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: green
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/search.js
extra:
  generator: false
# Estructura del menú lateral (Navegación)
nav:
  - Inicio: index.md
  - Integrantes:
      - Flora: autores/flora.md
      - Octito: autores/octito.md
      - Octazo: autores/octazo.md
      - Pedro: autores/pedro.md
      - Ignacio: autores/nachoide.md
      - Gabriel: autores/gabrielini.md
  - Laboratorios SOC:
      - Análisis de Logs: labs/analisis-logs.md
      - Reglas Sigma: labs/labsreglas-sigma.md
